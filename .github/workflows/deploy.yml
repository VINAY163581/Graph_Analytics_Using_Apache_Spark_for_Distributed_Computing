name: Deploy Graph Analytics to Dataproc

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  PROJECT_ID: project-34c13448-074a-417a-b64
  REGION: northamerica-northeast1
  CLUSTER_NAME: ecommerce-cluster
  BUCKET_NAME: vinay-graph-dataproc-6731
  JAR_NAME: spark-graph-analytics-assembly-0.1.0.jar

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: projects/150195794927/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-ci@project-34c13448-074a-417a-b64.iam.gserviceaccount.com

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Set GCP project
        run: gcloud config set project "$PROJECT_ID"

      - name: Build fat jar
        run: sbt clean assembly

      - name: Generate sample graph input files
        run: |
          mkdir -p data/sample

          python3 << 'PY'
          import csv
          import random
          import os

          os.makedirs("data/sample", exist_ok=True)

          node_count = 10000
          edge_count = 100000
          days = 10
          per_day = edge_count // days
          rnd = random.Random(17)

          with open("data/sample/nodes.csv", "w", newline="") as nf:
              writer = csv.writer(nf)
              writer.writerow(["node_id", "type", "region"])
              for n in range(node_count):
                  region = f"r{(n % 5) + 1}"
                  writer.writerow([n, "user", region])

          with open("data/sample/edges.csv", "w", newline="") as ef:
              writer = csv.writer(ef)
              writer.writerow(["src", "dst", "timestamp"])
              for day in range(1, days + 1):
                  date = f"2026-01-{day:02d} 00:00:00"

                  for i in range(500):
                      src = i % 20
                      dst = rnd.randrange(node_count)
                      while dst == src:
                          dst = rnd.randrange(node_count)
                      writer.writerow([src, dst, date])

                  for _ in range(per_day):
                      src = rnd.randrange(node_count)
                      dst = rnd.randrange(node_count)
                      while dst == src:
                          dst = rnd.randrange(node_count)
                      writer.writerow([src, dst, date])
          PY

          ls -R data/sample

      - name: Upload jar to GCS
        run: |
          JAR_PATH=$(find target -name "*assembly*.jar" | head -n 1)

          if [ -z "$JAR_PATH" ]; then
            echo "Assembly jar not found"
            exit 1
          fi

          echo "Uploading jar: $JAR_PATH"
          gcloud storage cp "$JAR_PATH" "gs://${BUCKET_NAME}/jars/${JAR_NAME}"

      - name: Upload data to GCS
        run: |
          if [ -d "data" ]; then
            gcloud storage cp --recursive data "gs://${BUCKET_NAME}/"
            gcloud storage ls --recursive "gs://${BUCKET_NAME}/data/"
          else
            echo "data folder not found"
            exit 1
          fi

      - name: Submit Spark job to Dataproc
        run: |
          gcloud dataproc jobs submit spark \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --cluster="$CLUSTER_NAME" \
            --class=GraphAnalytics \
            --jars="gs://${BUCKET_NAME}/jars/${JAR_NAME}" \
            -- \
            --edges="gs://${BUCKET_NAME}/data/sample/edges.csv" \
            --nodes="gs://${BUCKET_NAME}/data/sample/nodes.csv" \
            --output="gs://${BUCKET_NAME}/output"